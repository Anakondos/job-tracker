// === PRICE ACTION PATTERN DETECTION ===
function detectPatterns(data) {
  let patterns = new Array(data.length).fill(null);

  for (let i = 0; i < data.length; i++) {
    let c = data[i];
    let body = Math.abs(c.c - c.o);
    let range = c.h - c.l;
    let upperWick = c.h - Math.max(c.o, c.c);
    let lowerWick = Math.min(c.o, c.c) - c.l;
    let bull = c.c >= c.o;
    let found = [];

    if (range === 0) continue;

    // --- Single candle patterns ---

    // Doji: body < 10% of range
    if (body / range < 0.1) {
      if (upperWick > range * 0.3 && lowerWick > range * 0.3) {
        found.push({ name: 'Doji', type: 'neutral', icon: '✦' });
      } else if (lowerWick > range * 0.6) {
        found.push({ name: 'Dragonfly Doji', type: 'bull', icon: '🜃' });
      } else if (upperWick > range * 0.6) {
        found.push({ name: 'Gravestone Doji', type: 'bear', icon: '🜁' });
      }
    }

    // Hammer: small body at top, long lower wick (>= 2x body), in downtrend
    if (body / range < 0.35 && lowerWick >= body * 2 && upperWick < body * 0.5 && i >= 3) {
      let downtrend = data[i-1].c < data[i-2].c && data[i-2].c < data[i-3].c;
      if (downtrend) {
        found.push({ name: 'Hammer', type: 'bull', icon: '⚒' });
      }
    }

    // Inverted Hammer: small body at bottom, long upper wick
    if (body / range < 0.35 && upperWick >= body * 2 && lowerWick < body * 0.5 && i >= 3) {
      let downtrend = data[i-1].c < data[i-2].c && data[i-2].c < data[i-3].c;
      if (downtrend) {
        found.push({ name: 'Inv Hammer', type: 'bull', icon: '⇑' });
      }
    }

    // Shooting Star: small body at bottom, long upper wick, in uptrend
    if (body / range < 0.35 && upperWick >= body * 2 && lowerWick < body * 0.5 && i >= 3) {
      let uptrend = data[i-1].c > data[i-2].c && data[i-2].c > data[i-3].c;
      if (uptrend) {
        found.push({ name: 'Shooting Star', type: 'bear', icon: '★' });
      }
    }

    // Hanging Man: like hammer but in uptrend
    if (body / range < 0.35 && lowerWick >= body * 2 && upperWick < body * 0.5 && i >= 3) {
      let uptrend = data[i-1].c > data[i-2].c && data[i-2].c > data[i-3].c;
      if (uptrend) {
        found.push({ name: 'Hanging Man', type: 'bear', icon: '☠' });
      }
    }

    // Marubozu: body > 90% of range (strong momentum)
    if (body / range > 0.9) {
      found.push({ name: bull ? 'Bull Marubozu' : 'Bear Marubozu', type: bull ? 'bull' : 'bear', icon: bull ? '▲' : '▼' });
    }

    // Spinning Top: small body in middle, both wicks > body
    if (body / range > 0.1 && body / range < 0.3 && upperWick > body && lowerWick > body) {
      found.push({ name: 'Spinning Top', type: 'neutral', icon: '◎' });
    }

    // --- Two candle patterns ---
    if (i >= 1) {
      let p = data[i-1];
      let pBody = Math.abs(p.c - p.o);
      let pBull = p.c >= p.o;
      let pRange = p.h - p.l;

      // Bullish Engulfing
      if (!pBull && bull && c.o <= p.c && c.c >= p.o && body > pBody * 1.1) {
        found.push({ name: 'Bull Engulfing', type: 'bull', icon: '⬆' });
      }

      // Bearish Engulfing
      if (pBull && !bull && c.o >= p.c && c.c <= p.o && body > pBody * 1.1) {
        found.push({ name: 'Bear Engulfing', type: 'bear', icon: '⬇' });
      }

      // Bullish Harami: big red then small green inside
      if (!pBull && bull && pBody > body * 1.5 && c.o >= p.c && c.c <= p.o) {
        found.push({ name: 'Bull Harami', type: 'bull', icon: '⊕' });
      }

      // Bearish Harami: big green then small red inside
      if (pBull && !bull && pBody > body * 1.5 && c.o <= p.c && c.c >= p.o) {
        found.push({ name: 'Bear Harami', type: 'bear', icon: '⊖' });
      }

      // Tweezer Top: same high in uptrend
      if (i >= 3 && Math.abs(c.h - p.h) / range < 0.05 && pBull && !bull) {
        let uptrend = data[i-2].c > data[i-3].c;
        if (uptrend) found.push({ name: 'Tweezer Top', type: 'bear', icon: '⫏' });
      }

      // Tweezer Bottom: same low in downtrend
      if (i >= 3 && Math.abs(c.l - p.l) / range < 0.05 && !pBull && bull) {
        let downtrend = data[i-2].c < data[i-3].c;
        if (downtrend) found.push({ name: 'Tweezer Bottom', type: 'bull', icon: '⫐' });
      }

      // Piercing Line: gap down then close above 50% of prev body
      if (!pBull && bull && c.o < p.c && c.c > (p.o + p.c) / 2 && c.c < p.o) {
        found.push({ name: 'Piercing', type: 'bull', icon: '↗' });
      }

      // Dark Cloud Cover: gap up then close below 50% of prev body
      if (pBull && !bull && c.o > p.c && c.c < (p.o + p.c) / 2 && c.c > p.o) {
        found.push({ name: 'Dark Cloud', type: 'bear', icon: '↘' });
      }
    }

    // --- Three candle patterns ---
    if (i >= 2) {
      let p1 = data[i-2], p2 = data[i-1];
      let p1Bull = p1.c >= p1.o, p2Bull = p2.c >= p2.o;
      let p1Body = Math.abs(p1.c - p1.o), p2Body = Math.abs(p2.c - p2.o);

      // Morning Star
      if (!p1Bull && p1Body / (p1.h - p1.l || 1) > 0.5 && p2Body < p1Body * 0.3 && bull && body > p1Body * 0.5) {
        if (c.c > (p1.o + p1.c) / 2) {
          found.push({ name: 'Morning Star', type: 'bull', icon: '☀' });
        }
      }

      // Evening Star
      if (p1Bull && p1Body / (p1.h - p1.l || 1) > 0.5 && p2Body < p1Body * 0.3 && !bull && body > p1Body * 0.5) {
        if (c.c < (p1.o + p1.c) / 2) {
          found.push({ name: 'Evening Star', type: 'bear', icon: '☾' });
        }
      }

      // Three White Soldiers
      if (p1Bull && p2Bull && bull && p2.c > p1.c && c.c > p2.c && p1Body > 0 && p2Body > 0 && body > 0) {
        let goodBodies = p1Body / (p1.h-p1.l||1) > 0.5 && p2Body / (p2.h-p2.l||1) > 0.5 && body / range > 0.5;
        if (goodBodies) found.push({ name: '3 White Soldiers', type: 'bull', icon: '⚔' });
      }

      // Three Black Crows
      if (!p1Bull && !p2Bull && !bull && p2.c < p1.c && c.c < p2.c && p1Body > 0 && p2Body > 0 && body > 0) {
        let goodBodies = p1Body / (p1.h-p1.l||1) > 0.5 && p2Body / (p2.h-p2.l||1) > 0.5 && body / range > 0.5;
        if (goodBodies) found.push({ name: '3 Black Crows', type: 'bear', icon: '☁' });
      }
    }

    if (found.length > 0) {
      // Keep strongest signal (prefer multi-candle patterns)
      patterns[i] = found[found.length - 1];
    }
  }
  return patterns;
}

let scrollOffset = 0;
let candleWidth = 12;
let gap = 4;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - 50;

}

function calcMA(data, period) {
  let ma = [];
  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) { ma.push(null); continue; }
    let sum = 0;
    for (let j = i - period + 1; j <= i; j++) sum += data[j].c;
    ma.push(sum / period);
  }
  return ma;
}

let mouseX = -1, mouseY = -1;

function draw() {
  let W = canvas.width, H = canvas.height;
  let volH = H * 0.18;
  let chartH = H - volH - 40;
  let priceW = 75;
  let chartW = W - priceW;
  
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, W, H);
  
  let totalW = candleWidth + gap;
  let visible = Math.floor(chartW / totalW);
  let startIdx = Math.max(0, candles.length - visible - scrollOffset);
  let endIdx = Math.min(candles.length, startIdx + visible);
  let vis = candles.slice(startIdx, endIdx);
  
  if (vis.length === 0) return;
  
  let minP = Math.min(...vis.map(c => c.l));
  let maxP = Math.max(...vis.map(c => c.h));
  let pad = (maxP - minP) * 0.08;
  minP -= pad; maxP += pad;
  let maxV = Math.max(...vis.map(c => c.v));
  
  let ma7 = calcMA(candles, 7);
  let ma25 = calcMA(candles, 25);
  
  function priceY(p) { return 20 + (1 - (p - minP) / (maxP - minP)) * chartH; }
  function volY(v) { return H - (v / maxV) * volH; }
  
  // Grid
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 0.5;
  ctx.fillStyle = COLORS.gridText;
  ctx.font = '11px monospace';
  ctx.textAlign = 'right';
  let steps = 8;
  for (let i = 0; i <= steps; i++) {
    let p = minP + (maxP - minP) * (i / steps);
    let y = priceY(p);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(chartW, y); ctx.stroke();
    ctx.fillText('$' + p.toFixed(2), W - 5, y + 4);
  }
  
  // Detect NY Open candle index (13:00 UTC = 9:00 AM ET for today)
  function isNYOpen(candle) {
    let d = new Date(candle.t);
    let utcH = d.getUTCHours();
    // NY opens 9:30 ET; EDT = UTC-4, so 9 AM ET = 13 UTC
    return utcH === 13;
  }
  // Find the latest NY open candle in visible range
  let nyOpenVisIdx = -1;
  vis.forEach((c, i) => { if (isNYOpen(c)) nyOpenVisIdx = i; });

  // Candles
  let hoverIdx = -1;
  vis.forEach((c, i) => {
    let x = i * totalW + totalW / 2;
    let bull = c.c >= c.o;
    let color = bull ? COLORS.up : COLORS.down;
    let isNY = (i === nyOpenVisIdx);

    // NY Open: highlight background column
    if (isNY) {
      ctx.fillStyle = 'rgba(255,215,0,0.06)';
      ctx.fillRect(x - totalW/2 - 2, 20, totalW + 4, chartH + 10);
      // Vertical dashed gold line
      ctx.strokeStyle = 'rgba(255,215,0,0.35)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(x, 20); ctx.lineTo(x, chartH + 30); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Wick
    ctx.strokeStyle = isNY ? '#ffd700' : color;
    ctx.lineWidth = isNY ? 2.5 : 1.5;
    ctx.beginPath();
    ctx.moveTo(x, priceY(c.h));
    ctx.lineTo(x, priceY(c.l));
    ctx.stroke();

    // Body
    let yTop = priceY(Math.max(c.o, c.c));
    let yBot = priceY(Math.min(c.o, c.c));
    let bodyH = Math.max(yBot - yTop, 1);
    if (isNY) {
      // Gold glow
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 12;
    }
    ctx.fillStyle = isNY ? (bull ? '#ffd700' : '#ff8f00') : color;
    ctx.fillRect(x - candleWidth/2, yTop, candleWidth, bodyH);
    if (isNY) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(x - candleWidth/2, yTop, candleWidth, bodyH);
      ctx.shadowBlur = 0;
    }

    // Volume
    ctx.fillStyle = isNY ? 'rgba(255,215,0,0.35)' : (bull ? COLORS.upVol : COLORS.downVol);
    let vy = volY(c.v);
    ctx.fillRect(x - candleWidth/2, vy, candleWidth, H - vy);

    // Time labels
    let d = new Date(c.t);
    if (isNY || i % Math.max(1, Math.floor(visible/8)) === 0) {
      ctx.fillStyle = isNY ? '#ffd700' : COLORS.gridText;
      ctx.textAlign = 'center';
      ctx.font = isNY ? 'bold 11px monospace' : '11px monospace';
      ctx.fillText(d.getUTCHours().toString().padStart(2,'0') + ':00', x, chartH + 55);
      if (isNY) {
        ctx.fillText('NY OPEN', x, chartH + 70);
      } else if (d.getUTCHours() === 0 || i === 0) {
        let ds = d.toLocaleDateString('en', {month:'short', day:'numeric'});
        ctx.fillText(ds, x, chartH + 70);
      }
    }

    // Hover detect
    if (mouseX >= x - totalW/2 && mouseX < x + totalW/2) hoverIdx = i;
  });

  // === NY OPEN CANDLE ANNOTATION PANEL ===
  if (nyOpenVisIdx >= 0) {
    let nc = vis[nyOpenVisIdx];
    let nx = nyOpenVisIdx * totalW + totalW / 2;
    let bull = nc.c >= nc.o;
    let body = Math.abs(nc.c - nc.o);
    let range = nc.h - nc.l;
    let upperW = nc.h - Math.max(nc.o, nc.c);
    let lowerW = Math.min(nc.o, nc.c) - nc.l;
    let bodyPct = range > 0 ? (body / range * 100).toFixed(1) : '0';
    let upperPct = range > 0 ? (upperW / range * 100).toFixed(1) : '0';
    let lowerPct = range > 0 ? (lowerW / range * 100).toFixed(1) : '0';
    let chg = nc.c - nc.o;
    let chgPct = (chg / nc.o * 100).toFixed(2);

    // Determine panel side (left or right of candle to not go off-screen)
    let panelW = 195, panelH = 175;
    let panelLeft = nx + 20;
    if (panelLeft + panelW > chartW - 10) panelLeft = nx - panelW - 20;
    let panelTop = Math.max(30, priceY(nc.h) - 20);
    if (panelTop + panelH > chartH) panelTop = chartH - panelH - 5;

    // Connector line from candle to panel
    ctx.strokeStyle = 'rgba(255,215,0,0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    let connX = panelLeft > nx ? panelLeft : panelLeft + panelW;
    ctx.beginPath(); ctx.moveTo(nx, priceY(nc.h) - 5); ctx.lineTo(connX, panelTop + 10); ctx.stroke();
    ctx.setLineDash([]);

    // Panel background
    ctx.fillStyle = 'rgba(22,27,34,0.94)';
    ctx.strokeStyle = 'rgba(255,215,0,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(panelLeft, panelTop, panelW, panelH, 8);
    ctx.fill(); ctx.stroke();

    // Panel content
    ctx.textAlign = 'left';
    let px = panelLeft + 12, py = panelTop + 18;

    // Title
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('NY OPEN', px, py);
    ctx.fillStyle = '#8b949e';
    ctx.font = '10px monospace';
    ctx.fillText('9:00 AM ET', px + 72, py);

    py += 18;
    ctx.fillStyle = '#8b949e'; ctx.font = '10px monospace';
    ctx.fillText('O', px, py);
    ctx.fillStyle = '#fff';
    ctx.fillText('$' + nc.o.toFixed(2), px + 18, py);
    ctx.fillStyle = '#8b949e';
    ctx.fillText('H', px + 90, py);
    ctx.fillStyle = '#fff';
    ctx.fillText('$' + nc.h.toFixed(2), px + 108, py);

    py += 14;
    ctx.fillStyle = '#8b949e';
    ctx.fillText('C', px, py);
    ctx.fillStyle = bull ? '#26a69a' : '#ef5350';
    ctx.fillText('$' + nc.c.toFixed(2), px + 18, py);
    ctx.fillStyle = '#8b949e';
    ctx.fillText('L', px + 90, py);
    ctx.fillStyle = '#fff';
    ctx.fillText('$' + nc.l.toFixed(2), px + 108, py);

    // Divider
    py += 10;
    ctx.strokeStyle = '#30363d'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + panelW - 24, py); ctx.stroke();

    // Body bar
    py += 14;
    ctx.fillStyle = '#8b949e'; ctx.font = '10px monospace';
    ctx.fillText('Body', px, py);
    ctx.fillStyle = bull ? '#26a69a' : '#ef5350';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(bodyPct + '%', px + 40, py);
    // Bar
    let barX = px + 68, barW = panelW - 92;
    ctx.fillStyle = '#21262d';
    ctx.fillRect(barX, py - 7, barW, 8);
    ctx.fillStyle = bull ? '#26a69a' : '#ef5350';
    ctx.fillRect(barX, py - 7, barW * parseFloat(bodyPct) / 100, 8);

    // Upper wick bar
    py += 16;
    ctx.fillStyle = '#8b949e'; ctx.font = '10px monospace';
    ctx.fillText('Up W', px, py);
    ctx.fillStyle = '#8b949e';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(upperPct + '%', px + 40, py);
    ctx.fillStyle = '#21262d';
    ctx.fillRect(barX, py - 7, barW, 8);
    ctx.fillStyle = '#8b949e';
    ctx.fillRect(barX, py - 7, barW * parseFloat(upperPct) / 100, 8);

    // Lower wick bar
    py += 16;
    ctx.fillStyle = '#8b949e'; ctx.font = '10px monospace';
    ctx.fillText('Lo W', px, py);
    ctx.fillStyle = '#8b949e';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(lowerPct + '%', px + 40, py);
    ctx.fillStyle = '#21262d';
    ctx.fillRect(barX, py - 7, barW, 8);
    ctx.fillStyle = '#8b949e';
    ctx.fillRect(barX, py - 7, barW * parseFloat(lowerPct) / 100, 8);

    // Divider
    py += 10;
    ctx.strokeStyle = '#30363d'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + panelW - 24, py); ctx.stroke();

    // Verdict
    py += 14;
    ctx.fillStyle = bull ? '#26a69a' : '#ef5350';
    ctx.font = 'bold 11px sans-serif';
    let verdict = parseFloat(bodyPct) > 80 ? (bull ? 'BULL MARUBOZU' : 'BEAR MARUBOZU') :
                  parseFloat(bodyPct) < 10 ? 'DOJI' :
                  parseFloat(bodyPct) < 30 ? 'SPINNING TOP' :
                  bull ? 'BULLISH' : 'BEARISH';
    ctx.fillText(verdict, px, py);
    ctx.fillStyle = bull ? '#26a69a' : '#ef5350';
    ctx.font = '10px monospace';
    ctx.fillText((chg > 0 ? '+' : '') + chg.toFixed(2) + ' (' + chgPct + '%)', px + 105, py);

    py += 14;
    ctx.fillStyle = '#8b949e'; ctx.font = '10px monospace';
    ctx.fillText('Vol: ' + (nc.v > 1000 ? (nc.v/1000).toFixed(1) + 'K' : nc.v.toFixed(0)) + ' ETH', px, py);

    // Annotation arrows on candle itself: body dimension
    let nyYTop = priceY(Math.max(nc.o, nc.c));
    let nyYBot = priceY(Math.min(nc.o, nc.c));
    let dimX = nx + candleWidth/2 + 6;
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 1;
    // Body bracket
    ctx.beginPath(); ctx.moveTo(dimX, nyYTop); ctx.lineTo(dimX + 5, nyYTop); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(dimX, nyYBot); ctx.lineTo(dimX + 5, nyYBot); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(dimX + 5, nyYTop); ctx.lineTo(dimX + 5, nyYBot); ctx.stroke();
    ctx.fillStyle = '#ffd700';
    ctx.font = '9px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(bodyPct + '%', dimX + 8, (nyYTop + nyYBot) / 2 + 3);
  }
  
  // Price Action patterns
  let patterns = detectPatterns(candles);
  vis.forEach((c, i) => {
    let gi = startIdx + i;
    let pat = patterns[gi];
    if (!pat) return;
    let x = i * totalW + totalW / 2;
    let color = pat.type === 'bull' ? COLORS.bullSignal : pat.type === 'bear' ? COLORS.bearSignal : COLORS.neutralSignal;
    let above = pat.type === 'bear';
    let yAnchor = above ? priceY(c.h) - 8 : priceY(c.l) + 8;

    // Triangle marker
    ctx.fillStyle = color;
    ctx.beginPath();
    if (above) {
      ctx.moveTo(x, yAnchor + 4);
      ctx.lineTo(x - 5, yAnchor - 5);
      ctx.lineTo(x + 5, yAnchor - 5);
    } else {
      ctx.moveTo(x, yAnchor - 4);
      ctx.lineTo(x - 5, yAnchor + 5);
      ctx.lineTo(x + 5, yAnchor + 5);
    }
    ctx.closePath();
    ctx.fill();

    // Label
    ctx.fillStyle = color;
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    let labelY = above ? yAnchor - 10 : yAnchor + 14;
    ctx.fillText(pat.name, x, labelY);

    // Glow circle
    ctx.beginPath();
    ctx.arc(x, above ? yAnchor - 1 : yAnchor + 1, 3, 0, Math.PI * 2);
    ctx.fillStyle = color.replace('1)', '0.3)').replace('#', '');
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.arc(x, above ? yAnchor - 1 : yAnchor + 1, 10, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // MA lines
  function drawMA(maArr, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let started = false;
    vis.forEach((c, i) => {
      let gi = startIdx + i;
      if (maArr[gi] !== null) {
        let x = i * totalW + totalW/2;
        let y = priceY(maArr[gi]);
        if (!started) { ctx.moveTo(x, y); started = true; }
        else ctx.lineTo(x, y);
      }
    });
    ctx.stroke();
  }
  drawMA(ma7, COLORS.ma7);
  drawMA(ma25, COLORS.ma25);
  
  // Last price dashed line
  let lastP = vis[vis.length-1].c;
  ctx.strokeStyle = COLORS.priceLine;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.moveTo(0, priceY(lastP));
  ctx.lineTo(chartW, priceY(lastP));
  ctx.stroke();
  ctx.setLineDash([]);
  
  ctx.fillStyle = COLORS.priceLine;
  ctx.fillRect(chartW, priceY(lastP) - 10, priceW, 20);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px monospace';
  ctx.fillText('$' + lastP.toFixed(2), chartW + priceW/2, priceY(lastP) + 4);
  
  // Crosshair + tooltip
  if (mouseX > 0 && mouseY > 0 && hoverIdx >= 0) {
    ctx.strokeStyle = COLORS.crosshair;
    ctx.lineWidth = 0.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(mouseX, 0); ctx.lineTo(mouseX, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, mouseY); ctx.lineTo(W, mouseY); ctx.stroke();
    ctx.setLineDash([]);
    
    let c = vis[hoverIdx];
    let d = new Date(c.t);
    let bull = c.c >= c.o;
    let chg = c.c - c.o;
    let pct = (chg / c.o * 100).toFixed(2);
    
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(mouseX + 15, W - 200) + 'px';
    tooltip.style.top = Math.max(mouseY - 100, 10) + 'px';
    let patInfo = '';
    let hovPat = patterns[startIdx + hoverIdx];
    if (hovPat) {
      let patColor = hovPat.type === 'bull' ? COLORS.bullSignal : hovPat.type === 'bear' ? COLORS.bearSignal : COLORS.neutralSignal;
      let typeLabel = hovPat.type === 'bull' ? 'BULLISH' : hovPat.type === 'bear' ? 'BEARISH' : 'NEUTRAL';
      patInfo = '<div style="margin-top:6px;padding-top:6px;border-top:1px solid #2a2e39;color:' + patColor + ';font-weight:bold">' +
        hovPat.icon + ' ' + hovPat.name + '</div>' +
        '<div style="color:' + patColor + ';font-size:10px">' + typeLabel + ' signal</div>';
    }
    tooltip.innerHTML =
      '<div style="color:#fff;font-weight:bold">' + d.toUTCString().slice(0,-4) + '</div>' +
      '<div>O: <b>$' + c.o.toFixed(2) + '</b></div>' +
      '<div>H: <b>$' + c.h.toFixed(2) + '</b></div>' +
      '<div>L: <b>$' + c.l.toFixed(2) + '</b></div>' +
      '<div>C: <b style="color:' + (bull?COLORS.up:COLORS.down) + '">$' + c.c.toFixed(2) + '</b></div>' +
      '<div style="color:' + (bull?COLORS.up:COLORS.down) + '">' + (chg>0?'+':'') + chg.toFixed(2) + ' (' + pct + '%)</div>' +
      '<div style="color:#787b86">Vol: ' + (c.v>1000?(c.v/1000).toFixed(1)+'K':c.v.toFixed(0)) + '</div>' +
      patInfo;
  } else {
    tooltip.style.display = 'none';
  }
  
  // Info bar
  let last = candles[candles.length-1];
  let first = candles[candles.length-25] || candles[0];
  let ch = last.c - first.o;
  let cp = (ch/first.o*100).toFixed(2);
  let cls = ch >= 0 ? 'up' : 'down';
  infoEl.innerHTML = 
    '<span>O <b>' + last.o.toFixed(2) + '</b></span>' +
    '<span>H <b>' + last.h.toFixed(2) + '</b></span>' +
    '<span>L <b>' + last.l.toFixed(2) + '</b></span>' +
    '<span>C <b class="'+cls+'">' + last.c.toFixed(2) + '</b></span>' +
    '<span class="'+cls+'">24h: ' + (ch>0?'+':'') + ch.toFixed(2) + ' (' + cp + '%)</span>' +
    '<span style="color:#2196f3">━ MA7</span> <span style="color:#e040fb">━ MA25</span>' +
    '<span style="color:#00e676"> ▲ Bull</span> <span style="color:#ff1744"> ▼ Bear</span> <span style="color:#ffab00"> ◎ Neutral</span>';
}

canvas.addEventListener('mousemove', e => { mouseX = e.offsetX; mouseY = e.offsetY; draw(); });
canvas.addEventListener('mouseleave', () => { mouseX = -1; mouseY = -1; draw(); });
canvas.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    candleWidth = Math.max(4, Math.min(30, candleWidth + (e.deltaY > 0 ? -1 : 1)));
  } else {
    scrollOffset = Math.max(0, Math.min(candles.length - 10, scrollOffset + (e.deltaY > 0 ? 3 : -3)));
  }
  e.preventDefault(); draw();
}, {passive: false});

async function setTF(tf) {
  document.querySelectorAll('.tf').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  try {
    let r = await fetch("https://api.exchange.coinbase.com/products/ETH-USD/candles?granularity=" + tf);
    let data = await r.json();
    candles = data.slice(0, 72).map(c => ({t:c[0]*1000, o:c[3], h:c[2], l:c[1], c:c[4], v:c[5]})).reverse();
    scrollOffset = 0;
    draw();
  } catch(e) { console.error(e); }
}

window.addEventListener('resize', resize);
resize();

// Auto-refresh every 30s
setInterval(async () => {
  try {
    let r = await fetch("https://api.exchange.coinbase.com/products/ETH-USD/candles?granularity=3600");
    let data = await r.json();
    candles = data.slice(0, 72).map(c => ({t:c[0]*1000, o:c[3], h:c[2], l:c[1], c:c[4], v:c[5]})).reverse();
    draw();
  } catch(e) {}
}, 30000);
</script>
</body>
</html>
