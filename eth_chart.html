<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ETH/USD - Live Chart</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #131722; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #d1d4dc; overflow: hidden; }
.header { padding: 12px 20px; display: flex; align-items: center; gap: 20px; }
.pair { font-size: 22px; font-weight: 700; color: #fff; }
.tf { background: #2a2e39; border: none; color: #d1d4dc; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.tf:hover, .tf.active { background: #2962ff; color: #fff; }
.info { font-size: 13px; color: #787b86; }
.info span { margin-right: 12px; }
.up { color: #26a69a; } .down { color: #ef5350; }
.tooltip { position: absolute; background: #1e222d; border: 1px solid #2a2e39; border-radius: 6px; padding: 10px 14px; font-size: 12px; pointer-events: none; display: none; z-index: 10; }
.tooltip div { margin: 2px 0; }
canvas { display: block; }
</style>
</head>
<body>
<div class="header">
  <span class="pair">ETH / USD</span>
  <button class="tf active" onclick="setTF(3600)">1H</button>
  <button class="tf" onclick="setTF(900)">15M</button>
  <button class="tf" onclick="setTF(21600)">6H</button>
  <button class="tf" onclick="setTF(86400)">1D</button>
  <div class="info" id="info"></div>
</div>
<canvas id="chart"></canvas>
<div class="tooltip" id="tooltip"></div>

let canvas = document.getElementById('chart');
let ctx = canvas.getContext('2d');
let tooltip = document.getElementById('tooltip');
let infoEl = document.getElementById('info');

const COLORS = {
  bg: '#131722', grid: '#1e222d', gridText: '#787b86',
  up: '#26a69a', down: '#ef5350', upVol: 'rgba(38,166,154,0.3)', downVol: 'rgba(239,83,80,0.3)',
  ma7: '#2196f3', ma25: '#e040fb', crosshair: '#555',
  priceLine: '#2962ff'
};

let scrollOffset = 0;
let candleWidth = 12;
let gap = 4;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - 50;
  draw();
}

function calcMA(data, period) {
  let ma = [];
  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) { ma.push(null); continue; }
    let sum = 0;
    for (let j = i - period + 1; j <= i; j++) sum += data[j].c;
    ma.push(sum / period);
  }
  return ma;
}

let mouseX = -1, mouseY = -1;

function draw() {
  let W = canvas.width, H = canvas.height;
  let volH = H * 0.18;
  let chartH = H - volH - 40;
  let priceW = 75;
  let chartW = W - priceW;
  
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, W, H);
  
  let totalW = candleWidth + gap;
  let visible = Math.floor(chartW / totalW);
  let startIdx = Math.max(0, candles.length - visible - scrollOffset);
  let endIdx = Math.min(candles.length, startIdx + visible);
  let vis = candles.slice(startIdx, endIdx);
  
  if (vis.length === 0) return;
  
  let minP = Math.min(...vis.map(c => c.l));
  let maxP = Math.max(...vis.map(c => c.h));
  let pad = (maxP - minP) * 0.08;
  minP -= pad; maxP += pad;
  let maxV = Math.max(...vis.map(c => c.v));
  
  let ma7 = calcMA(candles, 7);
  let ma25 = calcMA(candles, 25);
  
  function priceY(p) { return 20 + (1 - (p - minP) / (maxP - minP)) * chartH; }
  function volY(v) { return H - (v / maxV) * volH; }
  
  // Grid
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 0.5;
  ctx.fillStyle = COLORS.gridText;
  ctx.font = '11px monospace';
  ctx.textAlign = 'right';
  let steps = 8;
  for (let i = 0; i <= steps; i++) {
    let p = minP + (maxP - minP) * (i / steps);
    let y = priceY(p);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(chartW, y); ctx.stroke();
    ctx.fillText('$' + p.toFixed(2), W - 5, y + 4);
  }
  
  // Candles
  let hoverIdx = -1;
  vis.forEach((c, i) => {
    let x = i * totalW + totalW / 2;
    let bull = c.c >= c.o;
    let color = bull ? COLORS.up : COLORS.down;
    
    // Wick
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, priceY(c.h));
    ctx.lineTo(x, priceY(c.l));
    ctx.stroke();
    
    // Body
    let yTop = priceY(Math.max(c.o, c.c));
    let yBot = priceY(Math.min(c.o, c.c));
    let bodyH = Math.max(yBot - yTop, 1);
    ctx.fillStyle = color;
    ctx.fillRect(x - candleWidth/2, yTop, candleWidth, bodyH);
    
    // Volume
    ctx.fillStyle = bull ? COLORS.upVol : COLORS.downVol;
    let vy = volY(c.v);
    ctx.fillRect(x - candleWidth/2, vy, candleWidth, H - vy);
    
    // Time labels
    let d = new Date(c.t);
    if (i % Math.max(1, Math.floor(visible/8)) === 0) {
      ctx.fillStyle = COLORS.gridText;
      ctx.textAlign = 'center';
      ctx.fillText(d.getUTCHours().toString().padStart(2,'0') + ':00', x, chartH + 55);
      if (d.getUTCHours() === 0 || i === 0) {
        let ds = d.toLocaleDateString('en', {month:'short', day:'numeric'});
        ctx.fillText(ds, x, chartH + 70);
      }
    }
    
    // Hover detect
    if (mouseX >= x - totalW/2 && mouseX < x + totalW/2) hoverIdx = i;
  });
  
  // MA lines
  function drawMA(maArr, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let started = false;
    vis.forEach((c, i) => {
      let gi = startIdx + i;
      if (maArr[gi] !== null) {
        let x = i * totalW + totalW/2;
        let y = priceY(maArr[gi]);
        if (!started) { ctx.moveTo(x, y); started = true; }
        else ctx.lineTo(x, y);
      }
    });
    ctx.stroke();
  }
  drawMA(ma7, COLORS.ma7);
  drawMA(ma25, COLORS.ma25);
  
  // Last price dashed line
  let lastP = vis[vis.length-1].c;
  ctx.strokeStyle = COLORS.priceLine;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.moveTo(0, priceY(lastP));
  ctx.lineTo(chartW, priceY(lastP));
  ctx.stroke();
  ctx.setLineDash([]);
  
  ctx.fillStyle = COLORS.priceLine;
  ctx.fillRect(chartW, priceY(lastP) - 10, priceW, 20);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px monospace';
  ctx.fillText('$' + lastP.toFixed(2), chartW + priceW/2, priceY(lastP) + 4);
  
  // Crosshair + tooltip
  if (mouseX > 0 && mouseY > 0 && hoverIdx >= 0) {
    ctx.strokeStyle = COLORS.crosshair;
    ctx.lineWidth = 0.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(mouseX, 0); ctx.lineTo(mouseX, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, mouseY); ctx.lineTo(W, mouseY); ctx.stroke();
    ctx.setLineDash([]);
    
    let c = vis[hoverIdx];
    let d = new Date(c.t);
    let bull = c.c >= c.o;
    let chg = c.c - c.o;
    let pct = (chg / c.o * 100).toFixed(2);
    
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(mouseX + 15, W - 200) + 'px';
    tooltip.style.top = Math.max(mouseY - 100, 10) + 'px';
    tooltip.innerHTML = 
      '<div style="color:#fff;font-weight:bold">' + d.toUTCString().slice(0,-4) + '</div>' +
      '<div>O: <b>$' + c.o.toFixed(2) + '</b></div>' +
      '<div>H: <b>$' + c.h.toFixed(2) + '</b></div>' +
      '<div>L: <b>$' + c.l.toFixed(2) + '</b></div>' +
      '<div>C: <b style="color:' + (bull?COLORS.up:COLORS.down) + '">$' + c.c.toFixed(2) + '</b></div>' +
      '<div style="color:' + (bull?COLORS.up:COLORS.down) + '">' + (chg>0?'+':'') + chg.toFixed(2) + ' (' + pct + '%)</div>' +
      '<div style="color:#787b86">Vol: ' + (c.v>1000?(c.v/1000).toFixed(1)+'K':c.v.toFixed(0)) + '</div>';
  } else {
    tooltip.style.display = 'none';
  }
  
  // Info bar
  let last = candles[candles.length-1];
  let first = candles[candles.length-25] || candles[0];
  let ch = last.c - first.o;
  let cp = (ch/first.o*100).toFixed(2);
  let cls = ch >= 0 ? 'up' : 'down';
  infoEl.innerHTML = 
    '<span>O <b>' + last.o.toFixed(2) + '</b></span>' +
    '<span>H <b>' + last.h.toFixed(2) + '</b></span>' +
    '<span>L <b>' + last.l.toFixed(2) + '</b></span>' +
    '<span>C <b class="'+cls+'">' + last.c.toFixed(2) + '</b></span>' +
    '<span class="'+cls+'">24h: ' + (ch>0?'+':'') + ch.toFixed(2) + ' (' + cp + '%)</span>' +
    '<span style="color:#2196f3">━ MA7</span> <span style="color:#e040fb">━ MA25</span>';
}

canvas.addEventListener('mousemove', e => { mouseX = e.offsetX; mouseY = e.offsetY; draw(); });
canvas.addEventListener('mouseleave', () => { mouseX = -1; mouseY = -1; draw(); });
canvas.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    candleWidth = Math.max(4, Math.min(30, candleWidth + (e.deltaY > 0 ? -1 : 1)));
  } else {
    scrollOffset = Math.max(0, Math.min(candles.length - 10, scrollOffset + (e.deltaY > 0 ? 3 : -3)));
  }
  e.preventDefault(); draw();
}, {passive: false});

async function setTF(tf) {
  document.querySelectorAll('.tf').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  try {
    let r = await fetch("https://api.exchange.coinbase.com/products/ETH-USD/candles?granularity=" + tf);
    let data = await r.json();
    candles = data.slice(0, 72).map(c => ({t:c[0]*1000, o:c[3], h:c[2], l:c[1], c:c[4], v:c[5]})).reverse();
    scrollOffset = 0;
    draw();
  } catch(e) { console.error(e); }
}

window.addEventListener('resize', resize);
resize();

// Auto-refresh every 30s
setInterval(async () => {
  try {
    let r = await fetch("https://api.exchange.coinbase.com/products/ETH-USD/candles?granularity=3600");
    let data = await r.json();
    candles = data.slice(0, 72).map(c => ({t:c[0]*1000, o:c[3], h:c[2], l:c[1], c:c[4], v:c[5]})).reverse();
    draw();
  } catch(e) {}
}, 30000);
</script>
